# MCP server configuration for Codex CLI
# Maintained in kafka-tools/ai for installation into the user Codex configuration

# -----------------------------------------------------------------------------
# v8std
# -----------------------------------------------------------------------------

[mcp_servers.v8std]
url = "https://ai.v8std.ru/mcp"
enabled = true
required = false
startup_timeout_sec = 5
description = "1C development standards, diagnostics and related materials"
default_tools_approval_mode = "approve"


# -----------------------------------------------------------------------------
# SonarQube
# -----------------------------------------------------------------------------

[mcp_servers.sonarqube]
url = "http://ia11:9001/mcp"
bearer_token_env_var = "SONAR_TOKEN"
enabled = true
required = false
startup_timeout_sec = 10
description = "SonarQube MCP server on ia11 over Streamable HTTP"
default_tools_approval_mode = "writes"


# -----------------------------------------------------------------------------
# Primary 1C MCP servers: EDT workspaces
# -----------------------------------------------------------------------------

[mcp_servers.kfk-edt]
url = "http://localhost:8765/mcp"
enabled = true
required = false
startup_timeout_sec = 2
description = "1C:EDT workspace for projects: adapter, base, examples."
default_tools_approval_mode = "approve"

[mcp_servers.kfk-unit-edt]
url = "http://localhost:8766/mcp"
enabled = true
required = false
startup_timeout_sec = 2
description = "1C:EDT workspace for Kafka Adapter unit tests, including the assembled adapter, base, examples, and YAxUnit projects."
default_tools_approval_mode = "approve"

[mcp_servers.conv-edt]
url = "http://localhost:8767/mcp"
enabled = true
required = false
startup_timeout_sec = 2
description = "1C:EDT workspace: КД — конфигурация «Конвертация данных 3.1»; KFK — расширение для адаптации конфигурации под Kafka-адаптер."
default_tools_approval_mode = "approve"
