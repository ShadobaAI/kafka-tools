# MCP server configuration for Codex CLI
# Generated by 1c-rules installer

# -----------------------------------------------------------------------------
# v8std
# -----------------------------------------------------------------------------

[mcp_servers.v8std]
url = "https://ai.v8std.ru/mcp"
enabled = true
required = false
startup_timeout_sec = 5
description = "1C development standards, diagnostics and related materials"
