#:schema https://developers.openai.com/codex/config-schema.json

# BEGIN SHARED-1C-AI MANAGED
# This block is installed idempotently by tools/ai/install.ps1.

[mcp_servers.v8std]
url = "http://127.0.0.1:8766/mcp"
enabled = true
required = false
startup_timeout_sec = 5
tool_timeout_sec = 60
enabled_tools = [
  "v8std_search",
  "v8std_get_page",
  "v8std_get_summary",
  "v8std_get_section",
  "v8std_get_pattern",
  "v8std_get_api_card",
  "v8std_get_requirements_for_context",
  "v8std_get_related",
  "v8std_get_related_ids",
  "v8std_explain_snippet",
  "v8std_explain_diagnostics",
]
description = "Local filtered 1C standards, YaXUnit, diagnostics, and snippet corpus"
default_tools_approval_mode = "approve"

[mcp_servers.code-index]
command = "powershell.exe"
args = [
  "-NoLogo",
  "-NoProfile",
  "-NonInteractive",
  "-ExecutionPolicy",
  "Bypass",
  "-File",
  "__CODE_INDEX_HOME__\\mcp\\code-index-mcp.ps1",
  "-CodeIndexHome",
  "__CODE_INDEX_HOME__",
]
enabled = true
required = false
startup_timeout_sec = 45
tool_timeout_sec = 120
description = "Federated read-only code and 1C metadata index; requires bsl-indexer daemon"
default_tools_approval_mode = "approve"
enabled_tools = [
  "get_function",
  "get_callers_bsl",
  "get_callees_bsl",
  "get_call_tree_bsl",
  "find_symbol",
  "read_file",
  "grep_code",
  "health",
  "get_object_structure",
  "get_form_handlers",
  "get_event_subscriptions",
  "find_path_bsl",
  "search_terms",
  "get_data_links",
  "find_data_path",
  "get_register_writers",
  "get_object_profile",
  "find_references",
  "bsl_sql",
]

# END SHARED-1C-AI MANAGED

# BEGIN KAFKA-AI GUARD
# This workspace-level guard is independent from the shared MCP registration.

[[hooks.PreToolUse]]
matcher = "^(Bash|shell|exec_command|apply_patch|view_image|mcp__code_index__.*|mcp__bsl_ls__.*|mcp__.*edt.*__(git|ask_workmate))$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File \"__AI_ROOT__\\hooks\\guard-1c-routing.ps1\" -WorkspaceRoot \"__WORKSPACE_ROOT__\""
timeout = 5
statusMessage = "Checking 1C routing policy"

# END KAFKA-AI GUARD
