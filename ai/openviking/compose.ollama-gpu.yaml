# Windows Docker Desktop with WSL2; RTX 3060 12 GiB, host RAM 32 GiB.
# Reuse the existing model volume. See INSTALL-WINDOWS-HYPERV.md before migration.
name: ollama-gpu

services:
  ollama:
    image: ollama/ollama:latest
    pull_policy: missing
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "30m"
      # The Git synchronizer currently submits documents sequentially.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_FLASH_ATTENTION: "1"
      # Preserve cache precision; do not trade quality for memory.
      OLLAMA_KV_CACHE_TYPE: "f16"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    healthcheck:
      # API liveness only; model inference is checked separately.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama-models:
    external: true
    name: ollama-models
