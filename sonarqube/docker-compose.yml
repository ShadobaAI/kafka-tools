services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
      POSTGRES_DB: ${SONARQUBE_DB_NAME:-sonarqube}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sonarqube_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  sonarqube:
    build:
      context: .
    image: local/sonarqube-bsl:latest
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${SONARQUBE_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped

  github-runner:
    image: myoung34/github-runner:ubuntu-jammy
    container_name: github-runner
    restart: unless-stopped
    environment:
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/ShadobaAI/kafka-adapter
      RUNNER_NAME: docker-sonar
      RUNNER_LABELS: self-hosted,linux,x64,sonar-docker
      RUNNER_WORKDIR: /_work
      ACCESS_TOKEN: ${GITHUB_ACCESS_TOKEN}
      UNSET_CONFIG_VARS: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work:/_work

volumes:
  sonarqube_postgres_data:
  sonarqube_data:
  sonarqube_logs:
  runner-work:
