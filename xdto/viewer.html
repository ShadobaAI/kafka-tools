</style>

<script>
(function () {
  'use strict';

  const PAGE_ID = '1';
  const ATTACHMENT_NAME = 'asyncapi.yaml';
  const SEARCH_DEBOUNCE_MS = 200;
  const MAX_SCHEMA_DEPTH = 80;
  const CSV_COLUMNS = [
    'FormatVersion', 'TopicShortName', 'TopicAddress', 'TopicTitle', 'Message',
    'Schema', 'Path', 'Level', 'Name', 'Title', 'Description', 'Required',
    'Deprecated', 'Type', 'Format', 'Ref', 'AllOf', 'Enum', 'EnumNames',
    'XTopics', 'MinItems', 'MaxItems', 'MinLength', 'MaxLength', 'Minimum',
    'Maximum', 'Pattern', 'Default', 'Extensions'
  ];

  const root = document.getElementById('asyncapi-schema-viewer');
  const state = {
    document: null,
    topic: null,
    query: '',
    requiredFilter: 'all',
    deprecatedFilter: 'all',
    elements: {},
    hashListenerInstalled: false
  };

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function append(parent) {
    for (let i = 1; i < arguments.length; i += 1) {
      const child = arguments[i];
      if (child !== null && child !== undefined) parent.appendChild(child);
    }
    return parent;
  }

  function hasOwn(value, key) {
    return Object.prototype.hasOwnProperty.call(value || {}, key);
  }

  function stringify(value, pretty) {
    if (typeof value === 'string') return value;
    if (value === undefined) return '';
    try { return JSON.stringify(value, null, pretty ? 2 : 0); }
    catch (error) { return String(value); }
  }

  function renderState(message, isError) {
    root.replaceChildren();
    const box = element('div', 'aav-state' + (isError ? ' aav-error' : ''));
    box.setAttribute('role', isError ? 'alert' : 'status');
    box.textContent = message;
    root.appendChild(box);
  }

  function contextPath() {
    if (window.AJS && typeof window.AJS.contextPath === 'function') return window.AJS.contextPath();
    const meta = document.querySelector('meta[name="ajs-context-path"]');
    return meta ? meta.getAttribute('content') || '' : '';
  }

  function resolvePageId() {
    if (PAGE_ID) return PAGE_ID;
    if (window.AJS && window.AJS.params && window.AJS.params.pageId) return String(window.AJS.params.pageId);
    const meta = document.querySelector('meta[name="ajs-page-id"]');
    if (meta && meta.getAttribute('content')) return meta.getAttribute('content');
    const queryId = new URLSearchParams(window.location.search).get('pageId');
    if (queryId) return queryId;
    const pathMatch = window.location.pathname.match(/\/pages\/(\d+)(?:\/|$)/);
    return pathMatch ? pathMatch[1] : '';
  }

  async function loadYaml() {
    const pageId = resolvePageId();
    if (!pageId) throw new Error('Не удалось определить pageId. Укажите PAGE_ID в конфигурации viewer.');
    const url = contextPath() + '/download/attachments/' + encodeURIComponent(pageId) + '/' + encodeURIComponent(ATTACHMENT_NAME);
    let response;
    try {
      response = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
    } catch (error) {
      throw new Error('Ошибка загрузки attachment: ' + error.message);
    }
    if (!response.ok) {
      if (response.status === 404) throw new Error('Attachment не найден: ' + ATTACHMENT_NAME);
      throw new Error('HTTP error при загрузке attachment: ' + response.status + ' ' + response.statusText);
    }
    return response.text();
  }

  /* Самодостаточный parser используемого конструктором YAML-подмножества: block maps/sequences,
     flow collections, quoted/plain scalars и block scalars. Ошибки всегда содержат номер строки. */
  function parseYaml(source) {
    const lines = String(source || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n').map(function (raw, index) {
      if (/^\s*\t/.test(raw) || /^ *[^ ]+\t/.test(raw)) throw yamlError(index + 1, 'табуляция в отступах не поддерживается');
      const indent = (raw.match(/^ */) || [''])[0].length;
      return { raw: raw, text: raw.slice(indent), indent: indent, number: index + 1 };
    });

    function yamlError(line, message) { return new Error('YAML parse error, строка ' + line + ': ' + message); }
    function ignorable(line) { return !line || /^\s*(?:#.*)?$/.test(line.raw) || /^(?:---|\.\.\.)\s*(?:#.*)?$/.test(line.text); }
    function nextSignificant(index) { while (index < lines.length && ignorable(lines[index])) index += 1; return index; }

    function splitPair(text, lineNumber) {
      let quote = '', escaped = false, square = 0, curly = 0;
      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        if (quote) {
          if (quote === '"' && char === '\\' && !escaped) { escaped = true; continue; }
          if (char === quote && !escaped) {
            if (quote === "'" && text[i + 1] === "'") { i += 1; continue; }
            quote = '';
          }
          escaped = false;
          continue;
        }
        if (char === '"' || char === "'") quote = char;
        else if (char === '[') square += 1;
        else if (char === ']') square -= 1;
        else if (char === '{') curly += 1;
        else if (char === '}') curly -= 1;
        else if (char === ':' && square === 0 && curly === 0 && (i === text.length - 1 || /\s/.test(text[i + 1]))) {
          const rawKey = text.slice(0, i).trim();
          if (!rawKey) throw yamlError(lineNumber, 'пустой ключ');
          return [parseScalar(rawKey, lineNumber, true), text.slice(i + 1).trim()];
        }
      }
      return null;
    }

    function stripComment(text) {
      let quote = '', escaped = false, square = 0, curly = 0;
      for (let i = 0; i < text.length; i += 1) {
        const char = text[i];
        if (quote) {
          if (quote === '"' && char === '\\' && !escaped) { escaped = true; continue; }
          if (char === quote && !escaped) {
            if (quote === "'" && text[i + 1] === "'") { i += 1; continue; }
            quote = '';
          }
          escaped = false;
        } else if (char === '"' || char === "'") quote = char;
        else if (char === '[') square += 1;
        else if (char === ']') square -= 1;
        else if (char === '{') curly += 1;
        else if (char === '}') curly -= 1;
        else if (char === '#' && square === 0 && curly === 0 && (i === 0 || /\s/.test(text[i - 1]))) return text.slice(0, i).trimEnd();
      }
      return text.trimEnd();
    }

    function parseQuoted(text, lineNumber) {
      if (text[0] === "'") {
        if (text[text.length - 1] !== "'") throw yamlError(lineNumber, 'незакрытая строка');
        return text.slice(1, -1).replace(/''/g, "'");
      }
      try { return JSON.parse(text); }
      catch (error) { throw yamlError(lineNumber, 'некорректная quoted string'); }
    }

    function parseFlow(text, lineNumber) {
      let index = 0;
      function ws() { while (/\s/.test(text[index] || '')) index += 1; }
      function token(stoppers) {
        ws();
        if (text[index] === '"' || text[index] === "'") {
          const quote = text[index++]; let value = quote; let escaped = false;
          while (index < text.length) {
            const char = text[index++]; value += char;
            if (quote === '"' && char === '\\' && !escaped) { escaped = true; continue; }
            if (char === quote && !escaped) {
              if (quote === "'" && text[index] === "'") { value += text[index++]; continue; }
              return parseQuoted(value, lineNumber);
            }
            escaped = false;
          }
          throw yamlError(lineNumber, 'незакрытая строка в flow collection');
        }
        const start = index;
        while (index < text.length && stoppers.indexOf(text[index]) < 0) index += 1;
        return parseScalar(text.slice(start, index).trim(), lineNumber);
      }
      function value() {
        ws();
        if (text[index] === '[') {
          index += 1; const result = []; ws();
          while (text[index] !== ']') {
            result.push(value()); ws();
            if (text[index] === ',') { index += 1; ws(); continue; }
            if (text[index] !== ']') throw yamlError(lineNumber, 'ожидались , или ]');
          }
          index += 1; return result;
        }
        if (text[index] === '{') {
          index += 1; const result = {}; ws();
          while (text[index] !== '}') {
            const key = token(':'); ws();
            if (text[index] !== ':') throw yamlError(lineNumber, 'ожидалось : в flow map');
            index += 1; result[String(key)] = value(); ws();
            if (text[index] === ',') { index += 1; ws(); continue; }
            if (text[index] !== '}') throw yamlError(lineNumber, 'ожидались , или }');
          }
          index += 1; return result;
        }
        return token(',]}');
      }
      const result = value(); ws();
      if (index !== text.length) throw yamlError(lineNumber, 'лишние символы после flow collection');
      return result;
    }

    function parseScalar(raw, lineNumber, isKey) {
      const text = stripComment(String(raw).trim());
      if (!text) return isKey ? '' : null;
      if (text[0] === '[' || text[0] === '{') return parseFlow(text, lineNumber);
      if (text[0] === '"' || text[0] === "'") return parseQuoted(text, lineNumber);
      if (/^(?:null|~)$/i.test(text)) return null;
      if (/^(?:true|false)$/i.test(text)) return text.toLowerCase() === 'true';
      if (/^[-+]?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][-+]?\d+)?$/.test(text)) return Number(text);
      if (!isKey && /^[&*!]/.test(text)) throw yamlError(lineNumber, 'anchors, aliases и tags не поддерживаются');
      return text;
    }

    function blockScalar(start, parentIndent, marker) {
      let index = start; const parts = []; let contentIndent = null;
      while (index < lines.length) {
        const line = lines[index];
        if (line.raw.trim() && line.indent <= parentIndent) break;
        if (!line.raw.trim()) { parts.push(''); index += 1; continue; }
        if (contentIndent === null) contentIndent = line.indent;
        parts.push(line.raw.slice(Math.min(contentIndent, line.raw.length)));
        index += 1;
      }
      let value = marker[0] === '>' ? parts.join('\n').replace(/([^\n])\n(?=[^\n])/g, '$1 ') : parts.join('\n');
      if (!/-$/.test(marker)) value += '\n';
      return { value: value, index: index };
    }

    function parseMap(start, indent) {
      const result = {}; let index = start;
      while (true) {
        index = nextSignificant(index);
        if (index >= lines.length || lines[index].indent < indent || /^-\s*(?:#.*)?$|^-\s+/.test(lines[index].text)) break;
        const line = lines[index];
        if (line.indent > indent) throw yamlError(line.number, 'неожиданный отступ');
        const pair = splitPair(line.text, line.number);
        if (!pair) throw yamlError(line.number, 'ожидалась пара key: value');
        const key = String(pair[0]);
        if (/^[|>][+-]?$/.test(pair[1])) {
          const parsedBlock = blockScalar(index + 1, indent, pair[1]);
          result[key] = parsedBlock.value; index = parsedBlock.index; continue;
        }
        if (pair[1] !== '') { result[key] = parseScalar(pair[1], line.number); index += 1; continue; }
        const childIndex = nextSignificant(index + 1);
        if (childIndex < lines.length && lines[childIndex].indent > indent) {
          const child = parseNode(childIndex, lines[childIndex].indent);
          result[key] = child.value; index = child.index;
        } else { result[key] = null; index += 1; }
      }
      return { value: result, index: index };
    }

    function parseSequence(start, indent) {
      const result = []; let index = start;
      while (true) {
        index = nextSignificant(index);
        if (index >= lines.length || lines[index].indent !== indent || !/^-(?:\s|$)/.test(lines[index].text)) break;
        const line = lines[index]; const rest = line.text.replace(/^-\s*/, '');
        if (!rest || /^#/.test(rest)) {
          const childIndex = nextSignificant(index + 1);
          if (childIndex < lines.length && lines[childIndex].indent > indent) {
            const child = parseNode(childIndex, lines[childIndex].indent); result.push(child.value); index = child.index;
          } else { result.push(null); index += 1; }
          continue;
        }
        const pair = splitPair(rest, line.number);
        if (!pair) { result.push(parseScalar(rest, line.number)); index += 1; continue; }
        const item = {}; const key = String(pair[0]);
        if (pair[1] !== '') { item[key] = parseScalar(pair[1], line.number); index += 1; }
        else {
          const childIndex = nextSignificant(index + 1);
          if (childIndex < lines.length && lines[childIndex].indent > indent + 1) {
            const child = parseNode(childIndex, lines[childIndex].indent); item[key] = child.value; index = child.index;
          } else { item[key] = null; index += 1; }
        }
        const continuation = nextSignificant(index);
        if (continuation < lines.length && lines[continuation].indent > indent) {
          const extra = parseMap(continuation, lines[continuation].indent);
          Object.keys(extra.value).forEach(function (extraKey) { item[extraKey] = extra.value[extraKey]; });
          index = extra.index;
        }
        result.push(item);
      }
      return { value: result, index: index };
    }

    function parseNode(start, indent) {
      const index = nextSignificant(start);
      if (index >= lines.length) return { value: null, index: index };
      return /^-(?:\s|$)/.test(lines[index].text) ? parseSequence(index, indent) : parseMap(index, indent);
    }

    const start = nextSignificant(0);
    if (start >= lines.length) throw new Error('YAML parse error: пустой документ');
    const parsed = parseNode(start, lines[start].indent);
    const tail = nextSignificant(parsed.index);
    if (tail < lines.length) throw yamlError(lines[tail].number, 'неожиданные данные');
    return parsed.value;
  }

  function decodeJsonPointerToken(token) {
    return decodeURIComponent(token).replace(/~1/g, '/').replace(/~0/g, '~');
  }

  function createResolver(document) {
    const cache = new Map();
    return function resolveRef(ref) {
      if (cache.has(ref)) return cache.get(ref);
      if (typeof ref !== 'string' || ref.slice(0, 2) !== '#/') throw new Error('Поддерживаются только локальные $ref вида #/...: ' + ref);
      let current = document;
      const tokens = ref.slice(2).split('/').map(decodeJsonPointerToken);
      for (let i = 0; i < tokens.length; i += 1) {
        if (current === null || typeof current !== 'object' || !hasOwn(current, tokens[i])) throw new Error('Не найден target для $ref: ' + ref);
        current = current[tokens[i]];
      }
      cache.set(ref, current);
      return current;
    };
  }

  function refName(ref) {
    if (!ref) return '';
    const parts = String(ref).split('/');
    try { return decodeJsonPointerToken(parts[parts.length - 1]); }
    catch (error) { return parts[parts.length - 1]; }
  }

  function shortTopicName(address) {
    const parts = String(address || '').split('.');
    return parts.length >= 2 ? parts[1] : String(address || '');
  }

  function topicDisplay(topic) {
    const payloadTitle = topic.messages && topic.messages.length && topic.messages[0].schema
      ? topic.messages[0].schema.title
      : '';
    const title = payloadTitle || topic.title;
    return topic.shortName + (title ? ' (' + title + ')' : '');
  }

  function normalizeExtensions(schema) {
    const extensions = {};
    Object.keys(schema || {}).forEach(function (key) {
      if (/^x-/.test(key) && key !== 'x-topics' && key !== 'x-enumNames') extensions[key] = schema[key];
    });
    return extensions;
  }

  function normalizeNode(schema, context, visitedRefs) {
    const raw = schema && typeof schema === 'object' ? schema : {};
    const node = {
      name: context.name,
      path: context.path,
      level: context.level,
      title: raw.title,
      description: raw.description,
      examples: Array.isArray(raw.examples) ? raw.examples : (hasOwn(raw, 'examples') ? [raw.examples] : []),
      deprecated: raw.deprecated === true,
      type: raw.type,
      format: raw.format,
      required: context.required === true,
      constraints: {},
      hasDefault: hasOwn(raw, 'default'),
      defaultValue: raw.default,
      ref: raw.$ref || '',
      allOfRefs: [],
      allOf: [],
      enumValues: Array.isArray(raw.enum) ? raw.enum : [],
      enumNames: Array.isArray(raw['x-enumNames']) ? raw['x-enumNames'] : [],
      xTopics: Array.isArray(raw['x-topics']) ? raw['x-topics'] : [],
      extensions: normalizeExtensions(raw),
      itemSchema: null,
      children: [],
      resolvedNode: null,
      errors: [],
      recursiveRef: false
    };
    ['minItems', 'maxItems', 'minLength', 'maxLength', 'minimum', 'maximum', 'pattern'].forEach(function (key) {
      if (hasOwn(raw, key)) node.constraints[key] = raw[key];
    });
    if (node.enumNames.length && node.enumNames.length !== node.enumValues.length) console.warn('AsyncAPI Viewer: длины enum и x-enumNames различаются для ' + context.path);
    if (context.level >= MAX_SCHEMA_DEPTH) {
      node.errors.push('Достигнут максимальный уровень вложенности: ' + MAX_SCHEMA_DEPTH);
      return node;
    }
    const requiredNames = Array.isArray(raw.required) ? raw.required : [];
    if (raw.properties && typeof raw.properties === 'object') {
      Object.keys(raw.properties).forEach(function (propertyName) {
        const propertyPath = context.path ? context.path + '.' + propertyName : propertyName;
        node.children.push(normalizeNode(raw.properties[propertyName], {
          name: propertyName, path: propertyPath, level: context.level + 1,
          required: requiredNames.indexOf(propertyName) >= 0, resolver: context.resolver
        }, new Set(visitedRefs)));
      });
    }
    if (raw.items && typeof raw.items === 'object') {
      node.itemSchema = normalizeNode(raw.items, {
        name: 'items', path: context.path + '[]', level: context.level + 1,
        required: false, resolver: context.resolver
      }, new Set(visitedRefs));
    }
    if (node.ref) {
      if (visitedRefs.has(node.ref)) node.recursiveRef = true;
      else {
        try {
          const nextVisited = new Set(visitedRefs); nextVisited.add(node.ref);
          node.resolvedNode = normalizeNode(context.resolver(node.ref), {
            name: refName(node.ref), path: context.path, level: context.level + 1,
            required: false, resolver: context.resolver
          }, nextVisited);
        } catch (error) { node.errors.push(error.message); }
      }
    }
    if (Array.isArray(raw.allOf)) {
      raw.allOf.forEach(function (part, index) {
        const label = part && part.$ref ? refName(part.$ref) : 'inline schema ' + (index + 1);
        node.allOfRefs.push(part && part.$ref ? part.$ref : 'inline schema ' + (index + 1));
        node.allOf.push(normalizeNode(part, {
          name: label, path: context.path, level: context.level + 1,
          required: false, resolver: context.resolver
        }, new Set(visitedRefs)));
      });
    }
    return node;
  }

  function buildDocumentModel(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('YAML document должен быть object.');
    if (!raw.channels || typeof raw.channels !== 'object') throw new Error('Документ не содержит channels.');
    const resolver = createResolver(raw);
    const topics = [];
    Object.keys(raw.channels).forEach(function (channelKey) {
      const channel = raw.channels[channelKey];
      if (!channel || !channel.address) return;
      const topic = {
        channelKey: channelKey,
        address: String(channel.address),
        shortName: shortTopicName(channel.address),
        title: channel.title ? String(channel.title) : '',
        description: channel.description ? String(channel.description) : '',
        displayName: '',
        messages: [], errors: []
      };
      const messages = channel.messages;
      if (!messages || typeof messages !== 'object') topic.errors.push('Channel не содержит messages.');
      else Object.keys(messages).forEach(function (messageKey) {
        let message = messages[messageKey];
        try { if (message && message.$ref) message = resolver(message.$ref); }
        catch (error) { topic.errors.push('Message ' + messageKey + ': ' + error.message); return; }
        if (!message || typeof message !== 'object') { topic.errors.push('Message ' + messageKey + ' не является object.'); return; }
        if (!message.payload) { topic.errors.push('Message ' + messageKey + ' не содержит payload.'); return; }
        let schema = message.payload; let schemaName = schema.$ref ? refName(schema.$ref) : (schema.title || messageKey + 'Payload');
        let initialRefs = new Set();
        if (schema.$ref) {
          try { initialRefs.add(schema.$ref); schema = resolver(schema.$ref); }
          catch (error) { topic.errors.push('Schema ' + schemaName + ': ' + error.message); return; }
        }
        try {
          topic.messages.push({
            name: message.name ? String(message.name) : messageKey,
            schemaName: String(schemaName),
            schema: normalizeNode(schema, { name: schemaName, path: '', level: 0, required: false, resolver: resolver }, initialRefs)
          });
        } catch (error) { topic.errors.push('Schema ' + schemaName + ': ' + error.message); }
      });
      topic.displayName = topicDisplay(topic);
      topics.push(topic);
    });
    topics.sort(function (a, b) { return a.displayName.localeCompare(b.displayName, undefined, { sensitivity: 'base' }); });
    if (!topics.length) throw new Error('Документ не содержит доступных топиков (channels с address).');
    return {
      asyncapiVersion: raw.asyncapi || '',
      formatVersion: raw.info && raw.info.version ? String(raw.info.version) : '',
      title: raw.info && raw.info.title ? String(raw.info.title) : '',
      description: raw.info && raw.info.description ? String(raw.info.description) : '',
      topics: topics,
      topicIndex: new Map(topics.map(function (topic) { return [topic.address, topic]; }))
    };
  }

  function readUrlState() {
    const rawHash = window.location.hash.replace(/^#/, '');
    if (!rawHash) return '';
    try { return new URLSearchParams(rawHash).get('topic') || ''; }
    catch (error) { return ''; }
  }

  function writeUrlState(address) {
    const hash = '#topic=' + encodeURIComponent(address);
    if (window.location.hash !== hash) window.history.replaceState(null, '', hash);
  }

  function valuesForSearch(value) {
    if (value === undefined || value === null) return '';
    return typeof value === 'object' ? stringify(value, false) : String(value);
  }

  function nodeOwnSearchText(node) {
    const extensionParts = [];
    Object.keys(node.extensions).forEach(function (key) { extensionParts.push(key, valuesForSearch(node.extensions[key])); });
    return [node.name, node.path, node.title, node.description, node.type, node.format, node.ref,
      refName(node.ref), node.enumValues.join(' '), node.enumNames.join(' '), node.xTopics.join(' '),
      node.hasDefault ? valuesForSearch(node.defaultValue) : '', valuesForSearch(node.constraints.pattern)
    ].concat(extensionParts).join('\n').toLocaleLowerCase();
  }

  function nodeMatches(node, query) {
    if (!query) return true;
    if (nodeOwnSearchText(node).includes(query)) return true;
    if (node.children.some(function (child) { return nodeMatches(child, query); })) return true;
    if (node.itemSchema && nodeMatches(node.itemSchema, query)) return true;
    if (node.resolvedNode && nodeMatches(node.resolvedNode, query)) return true;
    return node.allOf.some(function (part) { return nodeMatches(part, query); });
  }

  function messageOwnMatches(topic, message, query) {
    if (!query) return true;
    return [topic.shortName, topic.address, topic.title, topic.description, message.name, message.schemaName]
      .join('\n').toLocaleLowerCase().includes(query);
  }

  function badge(text, kind) { return element('span', 'aav-badge' + (kind ? ' aav-badge-' + kind : ''), text); }

  function addMeta(parent, label, value, code) {
    if (value === undefined || value === null || value === '') return;
    const row = element('div', 'aav-meta-row');
    append(row, element('strong', '', label + ': '), element('span', code ? 'aav-code' : '', valuesForSearch(value)));
    parent.appendChild(row);
  }

  function renderEnum(node) {
    if (!node.enumValues.length) return null;
    const details = element('details', 'aav-details');
    const previewValues = node.enumValues.slice(0, 4).map(valuesForSearch);
    const suffix = node.enumValues.length > 4 ? ', ...' : '';
    details.appendChild(element('summary', '', 'Enum (' + previewValues.join(', ') + suffix + ')'));
    const list = element('ol', 'aav-enum-list');
    node.enumValues.forEach(function (value, index) {
      const label = valuesForSearch(value) + (index < node.enumNames.length ? ' — ' + valuesForSearch(node.enumNames[index]) : '');
      list.appendChild(element('li', 'aav-code', label));
    });
    details.appendChild(list);
    return details;
  }

  function enumPreview(node) {
    if (!node || !node.enumValues.length) return '';
    const values = node.enumValues.slice(0, 4).map(valuesForSearch).join(', ');
    return '(' + values + (node.enumValues.length > 4 ? ', ...' : '') + ')';
  }

  function renderExamples(node) {
    if (!node.examples.length) return null;
    const details = element('details', 'aav-details');
    details.appendChild(element('summary', '', 'Примеры (' + node.examples.length + ')'));
    node.examples.forEach(function (example) { details.appendChild(element('pre', 'aav-json aav-code', stringify(example, true))); });
    return details;
  }

  function renderExtensions(node) {
    const keys = Object.keys(node.extensions);
    if (!keys.length) return null;
    const details = element('details', 'aav-details');
    details.appendChild(element('summary', '', 'Расширения'));
    keys.forEach(function (key) { addMeta(details, key, node.extensions[key], true); });
    return details;
  }

  function topicHref(address) {
    return window.location.href.replace(/#.*$/, '') + '#topic=' + encodeURIComponent(address);
  }

  function renderXTopics(node) {
    if (!node.xTopics.length) return null;
    const row = element('div', 'aav-meta-row'); row.appendChild(element('strong', '', 'Topics: '));
    node.xTopics.forEach(function (address, index) {
      if (index) row.appendChild(document.createTextNode(', '));
      const known = state.document.topicIndex.get(String(address));
      if (known) {
        const link = element('a', 'aav-link', topicDisplay(known));
        link.href = topicHref(known.address); link.target = '_blank'; link.rel = 'noopener noreferrer'; link.title = known.address;
        row.appendChild(link);
      } else {
        const text = element('span', '', shortTopicName(address) + ' (not channel)'); text.title = String(address); row.appendChild(text);
      }
    });
    return row;
  }

  function renderNode(node, query, forceVisible, mode) {
    const visible = forceVisible || nodeMatches(node, query);
    if (!visible) return null;
    const nested = node.children.length || node.itemSchema || node.resolvedNode || node.allOf.length || node.enumValues.length || node.examples.length || Object.keys(node.extensions).length;
    const container = element(nested ? 'details' : 'div', 'aav-node' + (node.deprecated ? ' aav-deprecated' : ''));
    if (nested && mode === 'root') container.open = true;
    if (nested && query) container.open = true;
    const line = element(nested ? 'summary' : 'div', 'aav-node-line');
    const fieldCell = element('span', 'aav-node-field');
    append(fieldCell, element('span', 'aav-node-name aav-code', node.name || '(schema)'), node.title ? element('span', 'aav-node-title', node.title) : null);
    if (node.required) fieldCell.appendChild(badge('required', 'required'));
    if (node.deprecated) fieldCell.appendChild(badge('deprecated', 'deprecated'));
    const typeCell = element('span', 'aav-node-type');
    const effectiveType = node.type || (node.resolvedNode && node.resolvedNode.type);
    const effectiveFormat = node.format || (node.resolvedNode && node.resolvedNode.format);
    if (effectiveType) typeCell.appendChild(badge(effectiveType));
    if (effectiveFormat) typeCell.appendChild(badge(effectiveFormat));
    if (node.enumValues.length || (node.resolvedNode && node.resolvedNode.enumValues.length)) typeCell.appendChild(badge('enum'));
    const preview = [];
    if (node.description) preview.push(node.description);
    ['minItems', 'maxItems', 'minLength', 'maxLength', 'minimum', 'maximum', 'pattern'].forEach(function (key) {
      if (hasOwn(node.constraints, key)) preview.push(key + ': ' + valuesForSearch(node.constraints[key]));
    });
    if (node.ref) preview.push('$ref: ' + refName(node.ref) + (enumPreview(node.resolvedNode) ? ' ' + enumPreview(node.resolvedNode) : ''));
    if (node.hasDefault) preview.push('default: ' + stringify(node.defaultValue, false));
    if (node.xTopics.length) preview.push('topics: ' + node.xTopics.length);
    const infoCell = element('span', 'aav-node-info', preview.join(' · '));
    append(line, fieldCell, typeCell, infoCell);
    container.appendChild(line);

    const body = nested ? element('div', 'aav-children') : container;
    const meta = element('div', 'aav-meta');
    if (node.hasDefault) addMeta(meta, 'default', stringify(node.defaultValue, false), true);
    if (node.ref) {
      const refRow = element('div', 'aav-meta-row');
      const resolvedEnumPreview = enumPreview(node.resolvedNode);
      append(refRow, element('strong', '', '$ref: '), element('span', 'aav-link aav-code', refName(node.ref)),
        resolvedEnumPreview ? document.createTextNode(' ' + resolvedEnumPreview) : null,
        document.createTextNode(' · ' + node.ref));
      meta.appendChild(refRow);
    }
    const topics = renderXTopics(node); if (topics) meta.appendChild(topics);
    const enumDetails = renderEnum(node); if (enumDetails) meta.appendChild(enumDetails);
    const examples = renderExamples(node); if (examples) meta.appendChild(examples);
    const extensions = renderExtensions(node); if (extensions) meta.appendChild(extensions);
    node.errors.forEach(function (message) { meta.appendChild(element('div', 'aav-warning', message)); });
    if (node.recursiveRef) meta.appendChild(element('div', 'aav-warning', '↳ ' + refName(node.ref) + ' (recursive reference)'));
    if (meta.childNodes.length) body.appendChild(meta);

    const childForce = forceVisible || !query || nodeOwnSearchText(node).includes(query);
    node.children.forEach(function (child) { const rendered = renderNode(child, query, childForce, 'child'); if (rendered) body.appendChild(rendered); });
    if (node.itemSchema) {
      const renderedItems = renderNode(node.itemSchema, query, childForce, 'child'); if (renderedItems) body.appendChild(renderedItems);
    }
    if (node.resolvedNode && !node.recursiveRef) {
      const renderedRef = renderNode(node.resolvedNode, query, childForce, 'ref'); if (renderedRef) body.appendChild(renderedRef);
    }
    if (node.allOf.length) {
      const group = element('details', 'aav-details'); group.open = !!query;
      group.appendChild(element('summary', '', 'allOf (' + node.allOf.length + ')'));
      node.allOf.forEach(function (part) { const rendered = renderNode(part, query, childForce, 'allOf'); if (rendered) group.appendChild(rendered); });
      body.appendChild(group);
    }
    if (nested) container.appendChild(body);
    return container;
  }

  function directPropertyChildren(node) {
    const result = [];
    const seenContainers = new Set();
    const seenProperties = new Set();
    function collect(container) {
      if (!container || seenContainers.has(container)) return;
      seenContainers.add(container);
      (container.children || []).forEach(function (property) {
        if (!seenProperties.has(property)) { seenProperties.add(property); result.push(property); }
      });
      if (container.itemSchema) collect(container.itemSchema);
      if (container.resolvedNode && !container.recursiveRef) collect(container.resolvedNode);
      (container.allOf || []).forEach(collect);
    }
    collect(node);
    return result;
  }

  function fieldStatusMatches(node, ignoreFilters) {
    if (ignoreFilters) return true;
    if (state.requiredFilter === 'yes' && !node.required) return false;
    if (state.requiredFilter === 'no' && node.required) return false;
    if (state.deprecatedFilter === 'yes' && !node.deprecated) return false;
    if (state.deprecatedFilter === 'no' && node.deprecated) return false;
    return true;
  }

  function nodeOrWrapperOwnMatches(node, query, visited) {
    if (!node || !query) return !query;
    const seen = visited || new Set();
    if (seen.has(node)) return false;
    seen.add(node);
    if (nodeOwnSearchText(node).includes(query)) return true;
    if (node.itemSchema && nodeOrWrapperOwnMatches(node.itemSchema, query, seen)) return true;
    if (node.resolvedNode && nodeOrWrapperOwnMatches(node.resolvedNode, query, seen)) return true;
    return (node.allOf || []).some(function (part) { return nodeOrWrapperOwnMatches(part, query, seen); });
  }

  function buildFieldRows(schema, query, forceVisible, ignoreStatusFilters) {
    let sequence = 0;
    function visit(container, depth, ancestors, forceQuery) {
      const rows = [];
      directPropertyChildren(container).forEach(function (property) {
        const id = 'aav-field-' + (++sequence);
        const ownQueryMatch = forceQuery || !query || nodeOrWrapperOwnMatches(property, query);
        const childForceQuery = forceQuery || ownQueryMatch;
        const children = visit(property, depth + 1, ancestors.concat(id), childForceQuery);
        if (!children.length && !(ownQueryMatch && fieldStatusMatches(property, ignoreStatusFilters))) return;
        rows.push({ id: id, node: property, depth: depth, ancestors: ancestors.slice(), hasChildren: children.length > 0 });
        Array.prototype.push.apply(rows, children);
      });
      return rows;
    }
    return visit(schema, 0, [], forceVisible || !query || nodeOrWrapperOwnMatches(schema, query));
  }

  function effectiveField(node) {
    const resolved = node.resolvedNode || {};
    return {
      title: node.title || resolved.title || '',
      description: node.description || resolved.description || '',
      type: node.type || resolved.type || '',
      format: node.format || resolved.format || '',
      constraints: Object.assign({}, resolved.constraints || {}, node.constraints || {}),
      hasDefault: node.hasDefault || resolved.hasDefault === true,
      defaultValue: node.hasDefault ? node.defaultValue : resolved.defaultValue,
      enumValues: node.enumValues.length ? node.enumValues : (resolved.enumValues || []),
      enumNames: node.enumNames.length ? node.enumNames : (resolved.enumNames || []),
      xTopics: node.xTopics.length ? node.xTopics : (resolved.xTopics || []),
      examples: node.examples.length ? node.examples : (resolved.examples || []),
      extensions: Object.assign({}, resolved.extensions || {}, node.extensions || {})
    };
  }

  function tableCell(className, value, code) {
    const cell = element('td', 'confluenceTd' + (className ? ' ' + className : ''));
    if (value === undefined || value === null || value === '') cell.appendChild(element('span', 'aav-cell-empty', '—'));
    else cell.appendChild(element('span', code ? 'aav-code' : '', valuesForSearch(value)));
    return cell;
  }

  function renderTableEnum(field) {
    const cell = element('td', 'aav-col-enum');
    if (!field.enumValues.length) { cell.appendChild(element('span', 'aav-cell-empty', '—')); return cell; }
    const details = element('details', 'aav-details');
    const preview = field.enumValues.slice(0, 4).map(valuesForSearch).join(', ') + (field.enumValues.length > 4 ? ', ...' : '');
    details.appendChild(element('summary', 'aav-code', preview));
    const list = element('div', 'aav-cell-list');
    field.enumValues.forEach(function (value, index) {
      list.appendChild(element('span', 'aav-code', valuesForSearch(value) + (index < field.enumNames.length ? ' — ' + valuesForSearch(field.enumNames[index]) : '')));
    });
    details.appendChild(list); cell.appendChild(details); return cell;
  }

  function renderTableTopics(field) {
    const cell = element('td', 'confluenceTd aav-col-topics');
    if (!field.xTopics.length) { cell.appendChild(element('span', 'aav-cell-empty', '—')); return cell; }
    const list = element('div', 'aav-cell-list');
    field.xTopics.forEach(function (address) {
      const known = state.document.topicIndex.get(String(address));
      if (known) {
        const link = element('a', 'aav-link', topicDisplay(known));
        link.href = topicHref(known.address); link.target = '_blank'; link.rel = 'noopener noreferrer'; link.title = known.address;
        list.appendChild(link);
      } else {
        const text = element('span', '', shortTopicName(address) + ' (not channel)'); text.title = String(address); list.appendChild(text);
      }
    });
    cell.appendChild(list); return cell;
  }

  function renderPropertyType(node, field) {
    const cell = element('td', 'confluenceTd aav-col-type');

  function renderTopic() {

      state.elements.exportButton.disabled = true;
      return;
    }
    state.elements.exportButton.disabled = false;
    const header = element('section', 'aav-topic-header');
    const primaryMessage = topic.messages[0];
    const primaryField = primaryMessage ? effectiveField(primaryMessage.schema) : {};
    header.appendChild(element('h2', '', topicDisplay(topic)));
    const fieldCount = topic.messages.reduce(function (total, message) {
      return total + buildFieldRows(message.schema, '', true, true).length;
    }, 0);
    const context = [topic.address];
    if (primaryField.type) context.push(primaryField.type);
    if (primaryField.format) context.push(primaryField.format);
    context.push(fieldCount + ' полей');
    header.appendChild(element('div', 'aav-context aav-code', context.join(' · ')));
    if (primaryField.description || topic.description) header.appendChild(element('p', 'aav-description', primaryField.description || topic.description));
    topic.messages.forEach(function (message, index) { appendPayloadInfo(header, message, index > 0); });
    content.appendChild(header);
    const tree = element('section', 'aav-tree');
    topic.errors.forEach(function (message) { tree.appendChild(element('div', 'aav-warning', message)); });
    let renderedCount = 0;

    content.appendChild(tree);
  }

      MaxLength: hasOwn(constraints, 'maxLength') ? constraints.maxLength : '',
      Minimum: hasOwn(constraints, 'minimum') ? constraints.minimum : '',
      Maximum: hasOwn(constraints, 'maximum') ? constraints.maximum : '',
      Pattern: hasOwn(constraints, 'pattern') ? constraints.pattern : '',
      Default: hasDefault ? stringify(defaultValue, false) : '',
      Extensions: Object.keys(node.extensions).length ? stringify(node.extensions, false) : ''
    };
  }

  function collectCsvNodes(node, query, forceVisible, result, seen, includeSelf) {
    const visible = forceVisible || nodeMatches(node, query);
    if (!visible) return;
    const ownMatch = forceVisible || !query || nodeOwnSearchText(node).includes(query);
    if (includeSelf !== false && node.level > 0 && node.name !== 'items') {
      const identity = node.path + '\u0000' + node.name + '\u0000' + node.ref;
      if (!seen.has(identity)) { seen.add(identity); result.push(node); }
    }
    node.children.forEach(function (child) { collectCsvNodes(child, query, ownMatch, result, seen, true); });
    if (node.itemSchema) collectCsvNodes(node.itemSchema, query, ownMatch, result, seen, false);
    if (node.resolvedNode && !node.recursiveRef) collectCsvNodes(node.resolvedNode, query, ownMatch, result, seen, false);
    node.allOf.forEach(function (part) { collectCsvNodes(part, query, ownMatch, result, seen, false); });
  }

  function buildCsvRows() {
    const rows = []; const topic = state.topic;
    if (!topic) return rows;
    topic.messages.forEach(function (message) {
      const force = messageOwnMatches(topic, message, state.query);
      buildFieldRows(message.schema, state.query, force, false).forEach(function (fieldRow) {
        rows.push(rowFromNode(topic, message, fieldRow.node));
      });
    });
    return rows;
  }

  function csvCell(value) {
    const text = value === undefined || value === null ? '' : String(value);
    return /[";\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function downloadCsv() {
    if (!state.topic) return;
    const rows = buildCsvRows();
    const csv = [CSV_COLUMNS.join(';')].concat(rows.map(function (row) {
      return CSV_COLUMNS.map(function (column) { return csvCell(row[column]); }).join(';');
    })).join('\r\n');
    const blob = new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8' });
    const link = document.createElement('a'); const url = URL.createObjectURL(blob);
    const date = new Date(); const day = [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-');
    const safeTopic = state.topic.shortName.replace(/[^A-Za-z0-9._-]+/g, '_');
    link.href = url;
    link.download = 'asyncapi_' + safeTopic + (state.document.formatVersion ? '_v' + state.document.formatVersion.replace(/[^A-Za-z0-9._-]+/g, '_') : '') + '_' + day + '.csv';
    document.body.appendChild(link); link.click(); link.remove(); window.setTimeout(function () { URL.revokeObjectURL(url); }, 0);
  }

  async function start() {
    renderState('Загрузка ' + ATTACHMENT_NAME + '…', false);
    try {
      const yaml = await loadYaml();
      let parsed;
      try { parsed = parseYaml(yaml); }
      catch (error) { throw new Error(error.message.indexOf('YAML parse error') === 0 ? error.message : 'YAML parse error: ' + error.message); }
      renderApp(buildDocumentModel(parsed));
    } catch (error) {
      console.error('AsyncAPI Viewer:', error);
      renderState(error.message || String(error), true);
    }
  }

  start();
}());
</script>
