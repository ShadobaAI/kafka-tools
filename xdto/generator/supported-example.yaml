components:
  schemas:
    UUID:
      type: string
      format: uuid

    OrderStatus:
      type: string
      enum: ['new', 'confirmed']
      x-enumNames: ['Новый', 'Подтверждён']

    Product:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          minLength: 1
      required: [id, name]

    Order:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        number:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/OrderStatus'
        comment:
          type: string
        delivery:
          type: object
          description: Группа реквизитов доставки.
          properties:
            city:
              type: string
            address:
              type: string
        lines:
          $ref: '#/components/schemas/OrderLines'
        tags:
          type: array
          items:
            type: string
            maxLength: 50
        fixedTags:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 2
            maxLength: 30
        directLines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderLine'
      required: [id, number, status, fixedTags, directLines]

    OrderLines:
      type: object
      properties:
        row:
          type: array
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderLine'

    OrderLine:
      type: object
      properties:
        productId:
          $ref: '#/components/schemas/UUID'
          x-topics: ['catalog.products.changed']
        quantity:
          type: number
          minimum: 0
          multipleOf: 0.01
      required: [productId, quantity]

    OrderLineEvent:
      type: object
      properties:
        ownerId:
          $ref: '#/components/schemas/UUID'
        lineId:
          $ref: '#/components/schemas/UUID'
        productId:
          $ref: '#/components/schemas/UUID'
        quantity:
          type: number
          minimum: 0
      required: [ownerId, lineId, productId, quantity]
