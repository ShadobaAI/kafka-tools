asyncapi: '3.1.0'

info:
  title: Universal AsyncAPI test spec for asyncapi2xsd.py
  version: '1.1.0'

defaultContentType: application/json

channels:
  testDocumentChanged:
    address: 1c.test-document.changed
    messages:
      testDocumentChanged:
        $ref: '#/components/messages/TestDocumentChangedMessage'

  catalogItemsChanged:
    address: 1c.catalog-items.changed
    messages:
      catalogItemsChanged:
        $ref: '#/components/messages/CatalogItemsChangedMessage'

  auditLogChanged:
    address: 1c.audit-log.changed
    messages:
      auditLogChanged:
        $ref: '#/components/messages/AuditLogChangedMessage'

  metricValuesChanged:
    address: 1c.metric-values.changed
    messages:
      metricValuesChanged:
        $ref: '#/components/messages/MetricValuesChangedMessage'

  dictionaryCodesChanged:
    address: 1c.dictionary-codes.changed
    messages:
      dictionaryCodesChanged:
        $ref: '#/components/messages/DictionaryCodesChangedMessage'

operations:
  sendTestDocumentChanged:
    action: send
    channel:
      $ref: '#/channels/testDocumentChanged'
    messages:
      - $ref: '#/channels/testDocumentChanged/messages/testDocumentChanged'

  sendCatalogItemsChanged:
    action: send
    channel:
      $ref: '#/channels/catalogItemsChanged'
    messages:
      - $ref: '#/channels/catalogItemsChanged/messages/catalogItemsChanged'

  sendAuditLogChanged:
    action: send
    channel:
      $ref: '#/channels/auditLogChanged'
    messages:
      - $ref: '#/channels/auditLogChanged/messages/auditLogChanged'

  sendMetricValuesChanged:
    action: send
    channel:
      $ref: '#/channels/metricValuesChanged'
    messages:
      - $ref: '#/channels/metricValuesChanged/messages/metricValuesChanged'

  sendDictionaryCodesChanged:
    action: send
    channel:
      $ref: '#/channels/dictionaryCodesChanged'
    messages:
      - $ref: '#/channels/dictionaryCodesChanged/messages/dictionaryCodesChanged'

components:
  messages:
    TestDocumentChangedMessage:
      name: TestDocumentChangedMessage
      payload:
        $ref: '#/components/schemas/TestDocumentPayload'

    CatalogItemsChangedMessage:
      name: CatalogItemsChangedMessage
      payload:
        $ref: '#/components/schemas/CatalogItemPayload'

    AuditLogChangedMessage:
      name: AuditLogChangedMessage
      payload:
        $ref: '#/components/schemas/AuditLogPayload'

    MetricValuesChangedMessage:
      name: MetricValuesChangedMessage
      payload:
        $ref: '#/components/schemas/MetricValuesPayload'

    DictionaryCodesChangedMessage:
      name: DictionaryCodesChangedMessage
      payload:
        $ref: '#/components/schemas/DictionaryCodesPayload'

  schemas:
    TestDocumentPayload:
      type: object
      required:
        - id
        - number
        - date
        - amount
        - roundedAmount
        - active
        - status
        - priority
        - currency
        - owner
        - lines
        - fixedTags
        - statusHistory
      properties:
        id:
          type: string
          format: uuid

        externalId:
          type: string
          minLength: 36
          maxLength: 36
          pattern: '^[0-9a-fA-F-]{36}$'

        number:
          type: string
          minLength: 1
          maxLength: 20
          pattern: '^[A-Z0-9-]+$'

        date:
          type: string
          format: date

        createdAt:
          type: string
          format: date-time

        eventTime:
          type: string
          format: time

        amount:
          type: number
          minimum: 0
          maximum: 999999999.99

        roundedAmount:
          type: number
          minimum: 0
          exclusiveMaximum: 1000000
          multipleOf: 0.01

        ratio:
          type: number
          format: float
          exclusiveMinimum: 0
          maximum: 1

        score:
          type: number
          format: double
          minimum: 0
          maximum: 100

        quantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          multipleOf: 1

        longCounter:
          type: integer
          format: int64
          minimum: 0

        active:
          type: boolean

        status:
          type: string
          enum:
            - Draft
            - Posted
            - Deleted

        priority:
          type: integer
          enum:
            - 1
            - 2
            - 3

        currency:
          $ref: '#/components/schemas/CurrencyCode'

        owner:
          $ref: '#/components/schemas/Person'

        contacts:
          $ref: '#/components/schemas/ContactList'

        tags:
          type: array
          items:
            type: string
            maxLength: 50

        fixedTags:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            minLength: 2
            maxLength: 30

        values:
          type: array
          minItems: 0
          maxItems: 5
          items:
            type: number
            minimum: 0
            multipleOf: 0.001

        statusHistory:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/LineStatus'

        dimensions:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: number
              minimum: 0

            height:
              type: number
              minimum: 0

            depth:
              type: number
              minimum: 0

            unit:
              type: string
              enum:
                - mm
                - cm
                - m

        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required:
              - lineNo
              - productId
              - qty
              - price
            properties:
              lineNo:
                type: integer
                minimum: 1

              productId:
                type: string
                format: uuid

              description:
                type: string
                maxLength: 200

              qty:
                type: number
                minimum: 0
                multipleOf: 0.001

              price:
                type: number
                minimum: 0
                multipleOf: 0.01

              lineStatus:
                $ref: '#/components/schemas/LineStatus'

              attributes:
                type: object
                properties:
                  color:
                    type: string
                    maxLength: 30

                  size:
                    type: string
                    maxLength: 30

    CatalogItemPayload:
      type: object
      required:
        - itemId
        - name
        - kind
      properties:
        itemId:
          type: string
          format: uuid

        name:
          type: string
          minLength: 1
          maxLength: 100

        kind:
          $ref: '#/components/schemas/ItemKind'

        parent:
          $ref: '#/components/schemas/CatalogItemRef'

        aliases:
          type: array
          minItems: 0
          maxItems: 10
          items:
            type: string
            maxLength: 100

    AuditLogPayload:
      type: object
      required:
        - eventId
        - occurredAt
        - entity
        - operation
      properties:
        eventId:
          type: string
          format: uuid

        occurredAt:
          type: string
          format: date-time

        entity:
          $ref: '#/components/schemas/EntityRef'

        operation:
          $ref: '#/components/schemas/OperationKind'

        oldValue:
          type: string

        newValue:
          type: string

        actor:
          $ref: '#/components/schemas/Person'

    MetricValuesPayload:
      type: array
      minItems: 1
      maxItems: 50
      items:
        type: object
        required:
          - code
          - value
        properties:
          code:
            type: string
            minLength: 1
            maxLength: 50

          value:
            type: number
            multipleOf: 0.01

          quality:
            $ref: '#/components/schemas/QualityKind'

    DictionaryCodesPayload:
      type: array
      minItems: 1
      maxItems: 20
      items:
        $ref: '#/components/schemas/CurrencyCode'

    StringListPayload:
      type: array
      minItems: 0
      maxItems: 10
      items:
        type: string
        pattern: '^[A-Z_]+$'

    Person:
      type: object
      required:
        - personId
        - name
      properties:
        personId:
          type: string
          format: uuid

        name:
          type: string
          maxLength: 150

        email:
          type: string
          format: email
          maxLength: 254

        manager:
          $ref: '#/components/schemas/Person'

    Contact:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - Email
            - Phone
            - Telegram

        value:
          type: string
          maxLength: 254

    ContactList:
      type: array
      minItems: 0
      maxItems: 5
      items:
        $ref: '#/components/schemas/Contact'

    CatalogItemRef:
      type: object
      required:
        - refId
      properties:
        refId:
          type: string
          format: uuid

        refName:
          type: string
          maxLength: 100

    EntityRef:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          minLength: 1
          maxLength: 100

        id:
          type: string
          format: uuid

        name:
          type: string
          maxLength: 150

    CurrencyCode:
      type: string
      enum:
        - RUB
        - USD
        - EUR

    LineStatus:
      type: string
      enum:
        - New
        - Changed
        - Deleted

    ItemKind:
      type: string
      enum:
        - Group
        - Item

    OperationKind:
      type: string
      enum:
        - Create
        - Update
        - Delete

    QualityKind:
      type: integer
      enum:
        - 0
        - 1
        - 2
