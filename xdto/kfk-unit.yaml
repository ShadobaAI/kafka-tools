asyncapi: 3.1.0
info:
  title: 1С. Адаптер Kafka - Пример преобразования типов
  version: 1.0.0
  description: Общий тестовый и демонстрационный пример преобразования типов
defaultContentType: application/json
components:
  schemas:
    TestCatalog:
      type: object
      additionalProperties: false
      required:
        - ref
        - name
      properties:
        ref:
          type: string
          format: uuid
        name:
          type: string
        dateTime:
          type: string
          format: date-time
        number:
          type: number
        boolean:
          type: boolean
        enum:
          type: string
          enum:
            - Значение1
            - Значение2
            - Значение3
        comment:
          type: string
        tabularSection:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              dateTime:
                type: string
                format: date-time
              string:
                type: string
    TestConversion:
      type: object
      additionalProperties: false
      required:
      - ref
      - name
      - requiredBoolean
      - requiredNumber
      - requiredString
      - fixedStrings
      - boundedNumbers
      - singleString
      - requiredRows
      properties:
        ref:
          type: string
          format: uuid
        name:
          type: string
        requiredBoolean:
          type: boolean
        requiredNumber:
          type: number
        requiredString:
          type: string
        optionalString:
          type: string
        boolean:
          type: boolean
        decimal:
          type: number
        integer:
          type: integer
        int32:
          type: integer
          format: int32
        int64:
          type: integer
          format: int64
        float:
          type: number
          format: float
        double:
          type: number
          format: double
        dateTime:
          type: string
          format: date-time
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        uuidAsString:
          type: string
          minLength: 36
          maxLength: 36
        patternString:
          type: string
          pattern: '[A-Z]{2}[0-9]{2}'
        boundedDecimal:
          type: number
          minimum: -100
          maximum: 100
          multipleOf: 0.01
        exclusiveDecimal:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 10
        boundedInteger:
          type: integer
          minimum: -2
          maximum: 2
        enum:
          type: string
          enum:
          - Значение1
          - Значение2
          - Значение3
        sharedEnum:
          $ref: '#/components/schemas/TestConversionEnum'
        integerEnum:
          type: integer
          enum:
          - -1
          - 0
          - 1
        decimalEnum:
          type: number
          enum:
          - -0.5
          - 0
          - 0.5
        catalog:
          $ref: '#/components/schemas/TestCatalog'
        nested:
          $ref: '#/components/schemas/TestConversionLevel1'
        recursive:
          $ref: '#/components/schemas/TestConversionNode'
        strings:
          type: array
          items:
            type: string
        numbers:
          type: array
          items:
            type: number
        booleans:
          type: array
          items:
            type: boolean
        dates:
          type: array
          items:
            type: string
            format: date-time
        refs:
          type: array
          items:
            type: string
            format: uuid
        enumValues:
          type: array
          items:
            $ref: '#/components/schemas/TestConversionEnum'
        fixedStrings:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            minLength: 1
        boundedNumbers:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: number
            minimum: 0
            maximum: 10
        singleString:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
        catalogs:
          type: array
          items:
            $ref: '#/components/schemas/TestCatalog'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/TestConversionNode'
        tabularSection:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - lineNumber
            properties:
              lineNumber:
                type: integer
              string:
                type: string
              number:
                type: number
              boolean:
                type: boolean
              dateTime:
                type: string
                format: date-time
              ref:
                type: string
                format: uuid
              enum:
                $ref: '#/components/schemas/TestConversionEnum'
              nested:
                $ref: '#/components/schemas/TestConversionLevel1'
              details:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - code
                  properties:
                    code:
                      type: string
                    value:
                      type: number
        requiredRows:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required:
            - code
            properties:
              code:
                type: string
                minLength: 1
              value:
                type: number
        singleRow:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
              value:
                type: number
        stringTable:
          $ref: '#/components/schemas/TestConversionStringTable'
        rowTable:
          $ref: '#/components/schemas/TestConversionRowTable'
        emptyObject:
          $ref: '#/components/schemas/TestConversionEmpty'
        additionalCases:
          $ref: '#/components/schemas/TestConversionAdditionalCases'
    TestConversionEnum:
      type: string
      enum:
      - Значение1
      - Значение2
      - Значение3
    TestConversionLevel1:
      type: object
      additionalProperties: false
      properties:
        level2:
          $ref: '#/components/schemas/TestConversionLevel2'
        sibling:
          type: string
    TestConversionLevel2:
      type: object
      additionalProperties: false
      properties:
        level3:
          $ref: '#/components/schemas/TestConversionLevel3'
        sibling:
          type: number
    TestConversionLevel3:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
        ref:
          type: string
          format: uuid
    TestConversionNode:
      type: object
      additionalProperties: false
      required:
      - ref
      properties:
        ref:
          type: string
          format: uuid
        name:
          type: string
        parent:
          $ref: '#/components/schemas/TestConversionNode'
        children:
          type: array
          items:
            $ref: '#/components/schemas/TestConversionNode'
    TestConversionStringTable:
      type: array
      items:
        type: string
    TestConversionRowTable:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - code
        properties:
          code:
            type: string
          value:
            type: number
    TestConversionEmpty:
      type: object
      additionalProperties: false
      properties: {}
    TestConversionAdditionalCases:
      type: object
      additionalProperties: false
      required:
      - objectId
      - dateTime
      properties:
        objectId:
          type: string
          format: uuid
          x-topics:
          - test.reference-type-1
        typeDocumentManagement:
          $ref: '#/components/schemas/TestConversionDocumentKindEnum'
        documentManagement:
          type: string
          format: uuid
          x-topics:
          - test.reference-type-7
          - test.reference-type-2
          - test.reference-type-8
          - test.reference-type-9
          - test.reference-type-4
          - test.reference-type-5
          - test.reference-type-6
          - test.reference-type-10
        dateTime:
          type: string
          format: date-time
        paymentKind:
          $ref: '#/components/schemas/TestConversionPaymentKind'
        stringLimits:
          $ref: '#/components/schemas/TestConversionStringLimits'
    TestConversionStringLimits:
      type: object
      additionalProperties: false
      properties:
        unlimited:
          type: string
        maxLength:
          type: string
          maxLength: 10
        minMaxLength:
          type: string
          minLength: 2
          maxLength: 10
    TestConversionPaymentKind:
      type: integer
      enum:
      - 0
      - 1
      x-enumNames:
      - Произвольно
      - РавнымиДолями
    TestConversionDocumentKindEnum:
      type: string
      enum:
      - Продажа
      - Интерес
      - Активность
      - ДоговорСПокупателем
      - Анкета
      - НетОснования
