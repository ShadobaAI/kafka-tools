name: Сборка CF/CFE

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Тип сборки: cf или cfe. Если не задан — определяется автоматически из .project'
        type: string
        required: false
        default: ''
      artifact_prefix:
        description: 'Префикс имени файла. Итог: {prefix}{version}.{cf|cfe}'
        type: string
        required: true
      version_placeholder:
        description: 'Заглушка версии в исходниках'
        type: string
        required: false
        default: '9.9.9.9'
      version_files:
        description: 'Доп. файлы для замены версии (через пробел, относительно корня)'
        type: string
        required: false
        default: ''
      edt_memory:
        description: 'Память JVM для EDT'
        type: string
        required: false
        default: '2g'
    outputs:
      version:
        description: 'Версия из тега релиза'
        value: ${{ jobs.build.outputs.version }}
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    name: ${{ inputs.build_type == 'cf' && 'CF' || 'cfe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/1c-ci-workflows
          path: .ci

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate version format
        run: |
          if [[ ! "${{ steps.version.outputs.value }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: неверный формат тега. Ожидается X.X.X.X"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get image digest
        id: digest
        run: |
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}:latest"
          digest=$(docker manifest inspect "$IMAGE" 2>/dev/null | \
            jq -r 'if .manifests then .manifests[0].digest else .config.digest end // "fallback"')
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Cache Docker image
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache/image.tar
          key: docker-${{ vars.DOCKERHUB_USERNAME }}-${{ vars.DOCKERHUB_IMAGE }}-${{ steps.digest.outputs.value }}

      - name: Load image from cache
        if: steps.cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache/image.tar

      - name: Pull and cache image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          IMAGE="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}:latest"
          docker pull "$IMAGE"
          mkdir -p /tmp/docker-cache
          docker save "$IMAGE" -o /tmp/docker-cache/image.tar

      - name: Build
        run: |
          mkdir -p output
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/.ci/scripts/build.sh:/build.sh:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -e BUILD_TYPE=${{ inputs.build_type }} \
            -e VERSION=${{ steps.version.outputs.value }} \
            -e VERSION_PLACEHOLDER=${{ inputs.version_placeholder }} \
            -e "VERSION_FILES=${{ inputs.version_files }}" \
            -e EDT_MEMORY=${{ inputs.edt_memory }} \
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}:latest \
            /build.sh

      - name: Fix permissions
        run: sudo chown $USER output/config.${{ inputs.build_type }}

      - name: Upload to release
        run: |
          FILENAME="${{ inputs.artifact_prefix }}${{ steps.version.outputs.value }}.${{ inputs.build_type }}"
          mv "output/config.${{ inputs.build_type }}" "output/$FILENAME"
          gh release upload "${{ github.event.release.tag_name }}" \
            "output/$FILENAME" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
