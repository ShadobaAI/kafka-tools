name: Release 1C artifacts

on:
  workflow_call:
    inputs:
      name_suffix:
        description: 'Суффикс имени файла. Итог: {name}-{suffix}-edt.zip, {name}-{suffix}-xml.zip'
        type: string
        required: false
        default: ''
      version_files:
        description: 'Дополнительные файлы для замены версии через пробел, относительно корня'
        type: string
        required: false
        default: ''
      pre_script:
        description: 'Скрипт для выполнения на EDT-исходниках до сборки, относительно корня, .py или .sh'
        type: string
        required: false
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kafka-tools
          path: .ci

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Pre-build script
        if: inputs.pre_script != ''
        env:
          PRE_SCRIPT: ${{ inputs.pre_script }}
        run: |
          case "$PRE_SCRIPT" in
            *.py) python3 "$PRE_SCRIPT" ;;
            *.sh) bash    "$PRE_SCRIPT" ;;
            *)    echo "ERROR: pre_script must be .py or .sh" && exit 1 ;;
          esac

      - name: Set version in sources
        id: meta
        env:
          VERSION_FILES: ${{ inputs.version_files }}
        run: |
          read -ra extra_files <<< "$VERSION_FILES"
          python3 .ci/.github/scripts/set_version.py \
            "${{ github.ref_name }}" \
            "${extra_files[@]}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.owner.outputs.value }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package EDT
        id: package_edt
        uses: ./.ci/.github/actions/package-zip
        with:
          source-dir: .
          output-file: output/${{ github.event.repository.name }}${{ inputs.name_suffix && format('-{0}', inputs.name_suffix) || '' }}-edt.zip

      - name: Convert EDT to XML
        uses: ./.ci/.github/actions/edt2xml
        with:
          source-dir: .
          xml-dir: ${{ runner.temp }}/output-xml

      - name: Package XML
        uses: ./.ci/.github/actions/package-zip
        with:
          source-dir: ${{ runner.temp }}/output-xml
          output-file: output/${{ github.event.repository.name }}${{ inputs.name_suffix && format('-{0}', inputs.name_suffix) || '' }}-xml.zip

      - name: Build CF
        if: steps.meta.outputs.project_type == 'cf'
        uses: ./.ci/.github/actions/xml2cf
        with:
          xml-dir: ${{ runner.temp }}/output-xml
          output-file: output/${{ github.event.repository.name }}.cf

      - name: Build CFE
        if: steps.meta.outputs.project_type == 'cfe'
        uses: ./.ci/.github/actions/xml2cf
        with:
          xml-dir: ${{ runner.temp }}/output-xml
          output-file: output/${{ github.event.repository.name }}.cfe

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
