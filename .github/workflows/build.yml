name: Сборка CF/CFE

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Тип сборки: cf или cfe. Если не задан — определяется автоматически из .project'
        type: string
        required: false
        default: ''
      name_suffix:
        description: 'Суффикс имени файла (необязательно). Итог: {name}-{suffix}-EDT.zip, {name}-{suffix}-XML.zip'
        type: string
        required: false
        default: ''
      version_files:
        description: 'Доп. файлы для замены версии (через пробел, относительно корня)'
        type: string
        required: false
        default: ''
      dockerhub_image:
        description: 'Имя образа (должен быть зеркалирован в GHCR)'
        type: string
        required: true
    outputs:
      version:
        description: 'Версия из тега релиза'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kafka-tools
          path: .ci

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate version format
        run: |
          if [[ ! "${{ steps.version.outputs.value }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: неверный формат тега. Ожидается X.X.X.X"
            exit 1
          fi

      - name: Detect project type and build target
        id: types
        run: |
          if grep -q 'V8ExtensionNature' .project 2>/dev/null; then
            project_type="cfe"
          else
            project_type="cf"
          fi
          build_type="${{ inputs.build_type }}"
          [ -z "$build_type" ] && build_type="$project_type"
          echo "project_type=$project_type" >> "$GITHUB_OUTPUT"
          echo "build_type=$build_type"     >> "$GITHUB_OUTPUT"

      - name: Get configuration name
        id: cfg
        run: |
          name=$(grep -oP '(?<=<name>)[^<]+' src/Configuration/Configuration.mdo | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Convert cfe → cf
        if: steps.types.outputs.project_type == 'cfe' && steps.types.outputs.build_type == 'cf'
        run: |
          # Удаляем теги расширения из Configuration.mdo
          python3 - <<'PYEOF'
          import re
          path = 'src/Configuration/Configuration.mdo'
          tags = [
            'objectBelonging',
            'extension',
            'keepMappingToExtendedConfigurationObjectsByIDs',
            'namePrefix',
            'configurationExtensionPurpose',
            'configurationExtensionCompatibilityMode',
          ]
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          for tag in tags:
              content = re.sub(rf'\s*<{tag}/>', '', content)
              content = re.sub(rf'\s*<{tag}>.*?</{tag}>', '', content, flags=re.DOTALL)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF
          # Меняем природу проекта
          sed -i 's/V8ExtensionNature/V8ConfigurationNature/g' .project
          # Удаляем строку Base-Project из PMF
          sed -i '/Base-Project/d' DT-INF/PROJECT.PMF

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          mkdir -p output output-xml
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/.ci/.github/scripts/build.sh:/build.sh:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -v "${{ github.workspace }}/output-xml:/tmp/xml" \
            -e BUILD_TYPE=${{ steps.types.outputs.build_type }} \
            -e VERSION=${{ steps.version.outputs.value }} \
            -e "VERSION_FILES=${{ inputs.version_files }}" \
            ghcr.io/${{ github.repository_owner }}/${{ inputs.dockerhub_image }}:latest \
            /build.sh
          sudo chown -R "$(id -u):$(id -g)" output/ output-xml/

      - name: Package artifacts
        id: pkg
        run: |
          NAME="${{ steps.cfg.outputs.name }}"
          EXT="${{ steps.types.outputs.build_type }}"
          SUFFIX="${{ inputs.name_suffix }}"
          BASE=$([ -n "$SUFFIX" ] && echo "${NAME}-${SUFFIX}" || echo "${NAME}")

          # EDT zip
          zip -r "output/${BASE}-EDT.zip" \
            .project .settings DT-INF src 2>/dev/null || \
          zip -r "output/${BASE}-EDT.zip" src

          # XML zip
          cd output-xml && zip -r "../output/${BASE}-XML.zip" . && cd ..

          # CF/CFE
          mv "output/config.${EXT}" "output/${BASE}.${EXT}"
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        run: |
          BASE="${{ steps.pkg.outputs.base }}"
          EXT="${{ steps.types.outputs.build_type }}"
          gh release upload "${{ github.event.release.tag_name }}" \
            "output/${BASE}.${EXT}" \
            "output/${BASE}-EDT.zip" \
            "output/${BASE}-XML.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
