name: Сборка CF/CFE

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Тип сборки: cf или cfe. Если не задан — определяется автоматически из .project'
        type: string
        required: false
        default: ''
      name_suffix:
        description: 'Суффикс имени файла (необязательно). Итог: {name}-{suffix}-EDT.zip, {name}-{suffix}-XML.zip'
        type: string
        required: false
        default: ''
      version_files:
        description: 'Доп. файлы для замены версии (через пробел, относительно корня)'
        type: string
        required: false
        default: ''
      pre_script:
        description: 'Скрипт для выполнения на EDT-исходниках до сборки (относительно корня, .py или .sh)'
        type: string
        required: false
        default: ''
      dockerhub_image:
        description: 'Имя образа (должен быть зеркалирован в GHCR)'
        type: string
        required: true
    outputs:
      version:
        description: 'Версия из тега релиза'
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kafka-tools
          path: .ci

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Pre-build script
        if: inputs.pre_script != ''
        env:
          PRE_SCRIPT: ${{ inputs.pre_script }}
        run: |
          case "$PRE_SCRIPT" in
            *.py) python3 "$PRE_SCRIPT" ;;
            *.sh) bash    "$PRE_SCRIPT" ;;
            *)    echo "ERROR: pre_script должен быть .py или .sh" && exit 1 ;;
          esac

      - name: Detect project, validate version, get config name
        id: meta
        run: |
          python3 .ci/.github/scripts/detect_project.py \
            --version "${{ steps.version.outputs.value }}" \
            --build-type "${{ inputs.build_type }}"

      - name: Convert cfe → cf
        if: steps.meta.outputs.project_type == 'cfe' && steps.meta.outputs.build_type == 'cf'
        run: python3 .ci/.github/scripts/patch_mdo.py

      - name: Set version in sources
        env:
          VERSION_FILES: ${{ inputs.version_files }}
        run: |
          read -ra extra_files <<< "$VERSION_FILES"
          python3 .ci/.github/scripts/set_version.py \
            "${{ steps.version.outputs.value }}" \
            src/Configuration/Configuration.mdo \
            "${extra_files[@]}"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.owner.outputs.value }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          VERSION_FILES: ${{ inputs.version_files }}
        run: |
          mkdir -p output output-xml
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/.ci/.github/scripts/build.py:/build.py:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -v "${{ github.workspace }}/output-xml:/tmp/xml" \
            -e BUILD_TYPE=${{ steps.meta.outputs.build_type }} \
            -e VERSION=${{ steps.version.outputs.value }} \
            -e VERSION_FILES \
            ghcr.io/${{ steps.owner.outputs.value }}/${{ inputs.dockerhub_image }}:latest \
            python3 /build.py
          sudo chown -R "$(id -u):$(id -g)" output/ output-xml/

      - name: Package artifacts
        id: pkg
        env:
          CFG_NAME: ${{ steps.meta.outputs.cfg_name }}
        run: |
          python3 .ci/.github/scripts/package.py \
            --name    "$CFG_NAME" \
            --ext     "${{ steps.meta.outputs.build_type }}" \
            --suffix  "${{ inputs.name_suffix }}" \
            --version "${{ steps.version.outputs.value }}"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" output/* --clobber
