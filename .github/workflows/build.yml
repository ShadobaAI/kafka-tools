name: Сборка CF/CFE

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Тип сборки: cf или cfe. Если не задан — определяется автоматически из .project'
        type: string
        required: false
        default: ''
      artifact_prefix:
        description: 'Префикс имени файла. Итог: {prefix}{version}.{cf|cfe}'
        type: string
        required: true
      version_placeholder:
        description: 'Заглушка версии в исходниках'
        type: string
        required: false
        default: '9.9.9.9'
      version_files:
        description: 'Доп. файлы для замены версии (через пробел, относительно корня)'
        type: string
        required: false
        default: ''
      edt_memory:
        description: 'Память JVM для EDT'
        type: string
        required: false
        default: '2g'
      dockerhub_username:
        description: 'Docker Hub логин'
        type: string
        required: true
      dockerhub_image:
        description: 'Имя образа на Docker Hub'
        type: string
        required: true
    outputs:
      version:
        description: 'Версия из тега релиза'
        value: ${{ jobs.build.outputs.version }}
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  build:
    name: ${{ inputs.build_type == 'cf' && 'CF' || 'cfe' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/kafka-tools
          path: .ci

      - name: Extract version
        id: version
        run: echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate version format
        run: |
          if [[ ! "${{ steps.version.outputs.value }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: неверный формат тега. Ожидается X.X.X.X"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get image digest
        id: digest
        run: |
          IMAGE="${{ inputs.dockerhub_username }}/${{ inputs.dockerhub_image }}:latest"
          digest=$(docker manifest inspect "$IMAGE" 2>/dev/null | \
            jq -r 'if .manifests then .manifests[0].digest else .config.digest end // "fallback"')
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Cache Docker image
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-cache/image.tar
          key: docker-${{ inputs.dockerhub_username }}-${{ inputs.dockerhub_image }}-${{ steps.digest.outputs.value }}

      - name: Load image from cache
        if: steps.cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-cache/image.tar

      - name: Pull and cache image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          IMAGE="${{ inputs.dockerhub_username }}/${{ inputs.dockerhub_image }}:latest"
          docker pull "$IMAGE"
          mkdir -p /tmp/docker-cache
          docker save "$IMAGE" -o /tmp/docker-cache/image.tar

      - name: Build
        id: build
        run: |
          mkdir -p output output-xml
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/.ci/build1c/git-workflows/scripts/build.sh:/build.sh:ro" \
            -v "${{ github.workspace }}/output:/output" \
            -v "${{ github.workspace }}/output-xml:/tmp/xml" \
            -e BUILD_TYPE=${{ inputs.build_type }} \
            -e VERSION=${{ steps.version.outputs.value }} \
            -e VERSION_PLACEHOLDER=${{ inputs.version_placeholder }} \
            -e "VERSION_FILES=${{ inputs.version_files }}" \
            -e EDT_MEMORY=${{ inputs.edt_memory }} \
            ${{ inputs.dockerhub_username }}/${{ inputs.dockerhub_image }}:latest \
            /build.sh
          ext=$(ls output/config.cf output/config.cfe 2>/dev/null | head -1 | sed 's/.*\.//')
          echo "ext=$ext" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        id: pkg
        run: |
          PREFIX="${{ inputs.artifact_prefix }}"
          VER="${{ steps.version.outputs.value }}"
          EXT="${{ steps.build.outputs.ext }}"
          # EDT sources
          zip -r "output/${PREFIX}${VER}-edt.zip" \
            .project .settings DT-INF src 2>/dev/null || \
          zip -r "output/${PREFIX}${VER}-edt.zip" src
          # XML
          cd output-xml && zip -r "../output/${PREFIX}${VER}-xml.zip" . && cd ..
          # CF/CFE
          sudo chown $USER "output/config.${EXT}"
          mv "output/config.${EXT}" "output/${PREFIX}${VER}.${EXT}"

      - name: Upload to release
        run: |
          PREFIX="${{ inputs.artifact_prefix }}"
          VER="${{ steps.version.outputs.value }}"
          EXT="${{ steps.build.outputs.ext }}"
          gh release upload "${{ github.event.release.tag_name }}" \
            "output/${PREFIX}${VER}.${EXT}" \
            "output/${PREFIX}${VER}-edt.zip" \
            "output/${PREFIX}${VER}-xml.zip" \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
