name: Зеркало Docker образа

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SRC="${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}:latest"
          DST="ghcr.io/${OWNER}/${{ vars.DOCKERHUB_IMAGE }}:latest"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
